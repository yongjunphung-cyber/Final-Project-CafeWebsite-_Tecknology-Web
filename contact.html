<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Contact</title>
        <link rel="stylesheet" href="style.css">
        <style>
            h1 {color: white;}
            body {background-image: url(contact1.jpg);}
        </style>
    </head>
    <body>
        <header>
        <h1>Welcome to Local Cafe</h1>
            <nav class="navbar">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="menu.html">Menu</a></li>
                    <li><a href="order.html">Order</a></li>
                    <li><a href="contact.html">Contact</a></li>
                    <li><a href="login.html">Login</a></li>
                    <li class="indicator"></li>
                </ul>
            </nav>
        </header>

        <div class="contact-wrap">
            <div class="glass-card wide">
                <h2>About Us</h2>
                <div class="info-row"><span class="info-icon">&#x1F4CD;</span><p>Batu Pahat, Johor</p></div>
                <div class="info-row"><span class="info-icon">&#x23F0;</span><p>Open daily, 9 AM - 9 PM</p></div>
                <div class="info-row"><span class="info-icon">&#x1F4DE;</span><p>012-3456789</p></div>
            </div>

            <div class="glass-card wide">
                <h2>Send us a message</h2>
                <form>
                    <div class="input-box">
                        <span class="icon">&#x1F464;</span>
                        <input type="text" name="name" placeholder="Your Name" required>
                    </div>

                    <div class="input-box">
                        <span class="icon">&#x2709;</span>
                        <input type="email" name="email" placeholder="Email" required>
                    </div>

                    <textarea name="message" placeholder="Your message" rows="4" required></textarea>

                    <button type="submit" class="signin-btn">Send</button>
                </form>
            </div>
        </div>

        <div class="glass-card map-card">
            <h2>Find Us</h2>
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d7975.4631389924325!2d103.07427313918954!3d1.853170165784863!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x31d05fed885005b7%3A0xbb48ab49f8a45993!2sHe%20and%20She%20Coffee%20%40%20UTHM!5e0!3m2!1szh-CN!2smy!4v1791626482616!5m2!1szh-CN!2smy" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
        </div>
    </body>
</html>
