<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Order</title>
        <link rel="stylesheet" href="style.css">
        <style>
            h1 {color: white;}
            h2 {color: white;}
            form {color: white;}
            body {background-image: url(orderbackground.jpg);}
        </style>
    </head>
    <body>
        <header>
        <h1>Welcome to Local Cafe</h1>
            <nav class="navbar">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="menu.html">Menu</a></li>
                    <li><a href="order.html">Order</a></li>
                    <li><a href="contact.html">Contact</a></li>
                    <li><a href="login.html">Login</a></li>
                    <li class="indicator"></li>
                </ul>
            </nav>
        </header>
        <div class="contact-wrap">
            <div class="glass-card wide">
                <h2>Your Order</h2>
                <div id="orderSummary" class="order-summary"></div>
            </div>

            <div class="glass-card wide">
                <h2>Customer Details</h2>
                <form action="receipt.html" method="GET">
                    <div class="input-box">
                        <span class="icon">&#x1F464;</span>
                        <input type="text" name="name" placeholder="Name" required>
                    </div>

                    <div class="input-box">
                        <span class="icon">&#x1F4DE;</span>
                        <input type="tel" name="phone" placeholder="Phone" required>
                    </div>

                    <div class="input-box">
                        <span class="icon">&#x23F0;</span>
                        <input type="time" name="pickup" title="Pickup time">
                    </div>

                    <p class="field-label">Payment</p>
                    <div class="payment-options">
                        <label class="pay-option">
                            <input type="radio" name="payment" value="counter" required>
                            <span>Counter</span>
                        </label>
                        <label class="pay-option">
                            <input type="radio" name="payment" value="card">
                            <span>Card</span>
                        </label>
                        <label class="pay-option">
                            <input type="radio" name="payment" value="qr">
                            <span>QR Pay</span>
                        </label>
                    </div>

                    <input type="hidden" name="items" id="itemsInput">
                    <input type="hidden" name="total" id="totalInput">

                    <button type="submit" class="signin-btn">Confirm Order</button>
                </form>
            </div>
        </div>

        <script>
            const params = new URLSearchParams(window.location.search);
            const items = JSON.parse(params.get("items") || "[]");
            const total = params.get("total") || "";

            let summary = "";
            if (items.length === 0) {
                summary = "<p>Your order is empty. Please choose items from the Menu.</p>";
            } else {
                items.forEach(item => {
                    summary += `<div class="order-row"><span>${item.name} x ${item.qty}</span><span>RM${item.price * item.qty}</span></div>`;
                });
                summary += `<div class="order-total">${total}</div>`;
            }
            document.getElementById("orderSummary").innerHTML = summary;

            document.getElementById("itemsInput").value = JSON.stringify(items);
            document.getElementById("totalInput").value = total;
        </script>
    </body>
</html>
