<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Receipt</title>
        <style>
            body { font-family: Arial, sans-serif; background: #f9f9f9;}
            .receipt { 
                border: 1px solid #ccc; 
                background: #fff;
                padding: 20px; 
                width: 300px;
                margin: 40px auto;
                box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            }
            h2 { text-align: center; margin-bottom: 20px;}
            #details { line-height: 1.6; }
            button {
                display: block;
                margin: 20px auto 0;
                padding: 10px 20px;
                background: green;
                color: white;
                border: none;
                cursor: pointer;
            }
            button:hover {background: darkgreen;}
        </style>
    </head>
    <body>
        <div class="receipt">
            <h2>Receipt</h2>
            <div id="details"></div>
            <div class="button">
                <button onclick="window.print()">Print Receipt</button>
                <button class="back-btn" onclick="window.location.href='index.html'">Back to Home</button>
            </div>
        </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const items = JSON.parse(params.get("items")||"[]");

        let html = "<strong>Customer:</strong> " + params.get("name") + "<br>";
        html += "<strong>Phone:</strong> " + params.get("phone") + "<br>";
        html += "<strong>Pickup Time:</strong> " + params.get("pickup") + "<br>";
        html += "<strong>Payment:</strong> " + params.get("payment") + "<br><br>";

        html += "<strong>Items:</strong><br>";
        items.forEach(item => {
            html += `${item.name} x ${item.qty} = RM${item.price * item.qty}<br>`;
        });

        html += "<br><strong>" + params.get("total") + "</strong>";

        document.getElementById("details").innerHTML = html;
        </script>
    </body>
</html>
